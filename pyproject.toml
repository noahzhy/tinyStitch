[project]
name = "shelf-stitch"
version = "0.1.0"
description = "RGB shelf sequence stitching experiment"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.18", "opencv-python-headless>=4.10,<5", "numpy>=2.0", "scipy>=1.13", "pillow>=10.4", "psutil>=6.0", "torch>=2.6"]
[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

research = ["scikit-image>=0.25", "lpips>=0.1.4", "torchvision>=0.22,<0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[project.scripts]
tiny-stitch-research = "backend.research.cli:main"
